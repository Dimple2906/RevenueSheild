version: '3.8'

services:
  revenueshield:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/packages/database/prisma/dev.db
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_demo12345678}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-secret_demo12345678}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_demo}
    volumes:
      - revenueshield_data:/app/packages/database/prisma
    restart: unless-stopped

volumes:
  revenueshield_data:
